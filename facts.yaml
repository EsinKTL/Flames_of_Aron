# TEMEL GERÇEKLER DOSYASI v1
# Kaynak: 2026 NASA Space Apps "Flame in Freefall" challenge metni, aksi belirtilmedikçe.
# Her kayıt tek bir iddia içerir. Ajan bu kayıtlara id ile atıf yapar (örn. [F-005]).
#
# Kayıt türleri (karıştırmayın):
#   gerçek   : challenge metninden doğrudan, kaynaklı
#   hesap    : formülle hesaplanmış; girdiler ve formül yazılı
#   kural    : ajan davranış kuralı; bilimsel gerçek DEĞİL, ajan bunu gerçek gibi sunmaz
#
# durum alanı: dogrulandi (metinde birebir var) | dogrulanacak (metin dışı bilgi, elle kontrol edin)

gercekler:
  # --- Atmosfer ve basınç ---
  - id: F-001
    tur: gerçek
    konu: spacesuit
    iddia: "Spacesuit'ler yalnızca 4,3 psi basınca kadar %100 oksijenle doldurulur."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  - id: F-002
    tur: gerçek
    konu: dünya atmosferi
    iddia: "Dünya'da deniz seviyesi basıncı 14,7 psi'dır."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  - id: F-003
    tur: gerçek
    konu: dekompresyon
    iddia: "Dekompresyon hastalığından (the bends) kaçınmak için astronotlar, emilmiş azotu atmak üzere %100 oksijen soluyarak ön-solunum (pre-breathe) yapar."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  - id: F-004
    tur: gerçek
    konu: ay üssü atmosferi
    iddia: "Ön-solunum süresini kısaltmak ve Ay gezilerini kolaylaştırmak için Ay üssü ve basınçlı rover'ların basıncının ve oksijen konsantrasyonunun spacesuit ile Dünya atmosferi arasında bir değerde olması beklenmektedir."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  - id: F-005
    tur: gerçek
    konu: ay üssü atmosferi
    iddia: "Ay'da kullanılacak ara oksijen konsantrasyonunun büyük olasılıkla %30 veya üzeri, buna karşılık gelen basıncın ise 10,2 psi veya altı olması beklenmektedir."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  - id: F-006
    tur: gerçek
    konu: ay üssü atmosferi
    iddia: "Metne göre bu, Dünya atmosferine kıyasla oksijen konsantrasyonunda %40'tan fazla artış anlamına gelir ve malzemeleri çok daha yanıcı yapar."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  # --- Yanma fiziği ---
  - id: F-007
    tur: gerçek
    konu: yanıcılık
    iddia: "Yanıcılık oksijen konsantrasyonuna büyük ölçüde bağlıdır; mikro yerçekiminde hava akışı da önemlidir."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  - id: F-008
    tur: gerçek
    konu: mikro yerçekimi alevi
    iddia: "Serbest düşüşte kaldırma kuvveti ve yükselen sıcak gazlar olmadığı için alevler Dünya'dakinden çarpıcı biçimde farklıdır; örneğin mum alevi, oksijeni difüzyonla alan mavi bir küreye dönüşür."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  - id: F-009
    tur: gerçek
    konu: NASA yaklaşımı
    iddia: "NASA'nın uzay aracı yangın güvenliği çalışmaları önleme, algılama ve söndürme üzerine odaklanır. Önleme; ateşleme kaynaklarını kontrol ederek ve yanıcılık sınırlarını anlamaya dayalı malzeme seçimiyle sağlanır."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  # --- Yatırımlar ve konuları ---
  - id: F-010
    tur: gerçek
    konu: önleme / katı malzemeler
    iddia: "Kumaş ve plastik gibi katı malzemelerin yanıcılığı BASS, BASS-II ve Saffire-I, -II, -III çalışmalarında incelenmiştir."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  - id: F-011
    tur: gerçek
    konu: algılama
    iddia: "Yangın algılama, mikro yerçekiminde SAME ve SAME-R (Smoke and Aerosol Measurement Experiment) çalışmalarıyla test edilmiştir."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  - id: F-012
    tur: gerçek
    konu: söndürme
    iddia: "Söndürme, FLEX (Flame Extinguishment Experiment) çalışmasında oda atmosferinin karbondioksit ve helyumla seyreltilmesiyle incelenmiştir; ikisi de yangını bastırır."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  - id: F-013
    tur: gerçek
    konu: DAFT
    iddia: "SAME ve SAME-R'de duman algılama için kullanılan cihazlardan biri, DAFT ve DAFT-2 (Dust and Aerosol Measurement Feasibility Test) çalışmalarında toz algılamak için kullanılmıştır."
    kaynak: "Challenge metni, 'Other investigations in PSI'"
    durum: dogrulandi

  - id: F-014
    tur: gerçek
    konu: ACME-BRE
    iddia: "ACME projesindeki Burning Rate Emulator (BRE) deneyi gaz yakıt yaksa da, malzeme özelliklerinin bir fonksiyonu olarak durgun atmosferlerde malzeme yanıcılığının çalışmasıdır."
    kaynak: "Challenge metni, 'Other investigations in PSI'"
    durum: dogrulandi

  - id: F-015
    tur: gerçek
    konu: donanım / ACME
    iddia: "ACME projesindeki altı deney gaz yakıt alevleri içerir ve hepsi Combustion Integrated Rack (CIR) içinde aynı modüler ACME donanımıyla yapılmıştır."
    kaynak: "Challenge metni, 'Hardware'"
    durum: dogrulandi

  - id: F-016
    tur: gerçek
    konu: donanım / MDCA
    iddia: "FLEX, FLEX-2 ve Cool Flames Investigation (CFI) sıvı yakıt damlalarının yanmasını içerir ve CIR içinde Multi-user Droplet Combustion Apparatus (MDCA) ile yapılmıştır."
    kaynak: "Challenge metni, 'Hardware'"
    durum: dogrulandi

  - id: F-017
    tur: gerçek
    konu: donanım / MSG
    iddia: "BASS, BASS-II, SPICE ve SLICE birlikte hem katı hem gaz yakıtları içerir; hepsi Microgravity Science Glovebox (MSG) içinde, SPICE için üretilmiş modüler, fan tahrikli akış kanalıyla yapılmıştır."
    kaynak: "Challenge metni, 'Hardware'"
    durum: dogrulandi

  - id: F-018
    tur: gerçek
    konu: en yüksek O2 testleri
    iddia: "Mikro yerçekiminde en yüksek oksijen konsantrasyonlu testler, ACME'nin Cool Flames Investigation with Gases (CFI-G) çalışmasında yapılmıştır. Yanma odası azot ve yanıcı gaz (örn. propan) karışımıyla doldurulmuş, küresel brülörden ise %85'e kadar oksijen içeren oksijen-azot karışımı akıtılarak içten dışa alev oluşturulmuştur."
    kaynak: "Challenge metni, 'Spacesuits and oxygen concentration'"
    durum: dogrulandi

  # --- Kapsam ve veri boşlukları ---
  - id: F-019
    tur: gerçek
    konu: veri boşluğu
    iddia: "PSI'da şu anda kısmi yerçekimi (partial-gravity) yanma verisi yoktur. İleride Lunar-g Combustion Investigation (LUCI) ve Flammability of Materials on the Moon (FM2) gibi deneylerden eklenmesi beklenmektedir."
    kaynak: "Challenge metni, 'Partial-gravity data'"
    durum: dogrulandi

  - id: F-020
    tur: gerçek
    konu: kısmi yerçekimi benzetimi
    iddia: "ACME'nin E-FIELD Flames (Electric-Field Effects on Laminar Diffusion Flames) deneyinde kısmi yerçekimi, elektrik alanın alevlerde doğal olarak bulunan iyonlar üzerindeki etkisiyle taklit edilmiştir."
    kaynak: "Challenge metni, 'Partial-gravity data'"
    durum: dogrulandi

  - id: F-021
    tur: gerçek
    konu: ara yerçekimi
    iddia: "Mikro yerçekimi ve normal yerçekimi sonuçları, ara yerçekimi seviyelerinde olacakları sınırlayabilir (bound)."
    kaynak: "Challenge metni, 'Partial-gravity data'"
    durum: dogrulandi

  - id: F-022
    tur: gerçek
    konu: kapsam dışı
    iddia: "Roket ve iticilerle ilgili yangın güvenliği genel olarak PSI veritabanındaki araştırmaların kapsamı dışındadır; roket motorlarındaki yüksek hızlar yanmayı yerçekiminden bağımsız hale getirir."
    kaynak: "Challenge metni, 'Objectives' dipnotu"
    durum: dogrulandi

  - id: F-023
    tur: gerçek
    konu: veri erişimi
    iddia: "Düşük yerçekimi yanma deneylerinin sonuçları (örn. ISS'te yapılanlar) NASA'nın Physical Science Informatics (PSI) veritabanı üzerinden kamuya açılmaktadır."
    kaynak: "Challenge metni, 'Objectives'"
    durum: dogrulandi

  # --- Tarihsel olaylar ---
  - id: F-024
    tur: gerçek
    konu: tarihsel olaylar
    iddia: "Metinde anılan olaylar: 1967'de Apollo 1 mürettebatı, oksijenle dolu uzay aracında çıkan yangında yerde yapılan bir testte hayatını kaybetti; Apollo 13 mürettebatı oksijen tankı patlamasının yaşamı tehdit eden sonuçlarına dayandı; çok uluslu bir mürettebat, oksijen jeneratörü arızasının neden olduğu Mir istasyonu yangınından sağ kurtuldu; Artemis II görevinde bir duman alarmı çaldı."
    kaynak: "Challenge metni, 'Background'"
    durum: dogrulandi

  # --- Dünya uygulamaları ---
  - id: F-025
    tur: gerçek
    konu: Dünya uygulamaları
    iddia: "ISS için geliştirilen ince su sisi (fine-water-mist) söndürücülerin Dünya'da pratik uygulamaları vardır; NASA teknolojisi ayrıca karasal duman algılamada ve itfaiyeci ekipmanlarında (koruyucu giysi, hava tankları) iyileştirmelere yol açmıştır."
    kaynak: "Challenge metni, 'Objectives'"
    durum: dogrulandi

hesaplar:
  # Kısmi O2 basıncı = O2 oranı x toplam basınç. Hesabı LLM değil araç (calc_partial_pressure) yapmalı.
  - id: C-001
    tur: hesap
    konu: kısmi O2 basıncı, Ay üssü (alt sınır senaryosu)
    formul: "pO2 = 0,30 x 10,2 psi"
    girdiler: "O2 = %30 [F-005]; toplam basınç = 10,2 psi [F-005]"
    sonuc: "3,06 psi"
    not: "Metindeki 'en az %30 ve en fazla 10,2 psi' ifadesi tek bir nokta değil bir beklentidir. Bu, örnek bir noktadır; gerçek tasarım değerleri farklı olabilir."
    durum: dogrulandi

  - id: C-002
    tur: hesap
    konu: kısmi O2 basıncı, Dünya deniz seviyesi
    formul: "pO2 = 0,209 x 14,7 psi"
    girdiler: "O2 = %20,9 (genel bilgi, metinde YOK); toplam basınç = 14,7 psi [F-002]"
    sonuc: "yaklaşık 3,07 psi"
    durum: dogrulanacak   # %20,9 değerini güvenilir bir kaynaktan teyit edin

  - id: C-003
    tur: hesap
    konu: kısmi O2 basıncı, spacesuit
    formul: "pO2 = 1,00 x 4,3 psi"
    girdiler: "O2 = %100 [F-001]; toplam basınç = 4,3 psi [F-001]"
    sonuc: "4,3 psi"
    durum: dogrulandi

  - id: C-004
    tur: hesap
    konu: Dünya'ya göre göreli O2 oranı artışı
    formul: "0,30 / 0,209 - 1"
    girdiler: "Ay üssü O2 %30 [F-005]; Dünya O2 %20,9 (genel bilgi)"
    sonuc: "yaklaşık %43 artış; metindeki '%40'tan fazla' ifadesiyle uyumlu [F-006]"
    durum: dogrulanacak

kurallar:
  # Ajan davranış kuralları. Bilimsel gerçek değildir; system prompt'a girer.
  - id: R-001
    tur: kural
    kural: "Mikro yerçekimi sonuçlarını Ay veya Mars yerçekimine doğrudan genelleme. Genellemenin yapılamadığını ve nedenini ([F-019], [F-021]) açıkça belirt."

  - id: R-002
    tur: kural
    kural: "Ay veya Mars yerçekiminde yanma sorulursa PSI'da kısmi yerçekimi verisi olmadığını söyle [F-019]. Varsa yalnızca E-FIELD'ın bir benzetim olduğunu [F-020] ve sınırlama (bounding) mantığını [F-021] anlat."

  - id: R-003
    tur: kural
    kural: "Sadece O2 yüzdesine bakarak tehlikeyi yorumlama. Kısmi basıncı (hesap aracıyla), toplam basıncı, seyrelticiyi ve hava akışını birlikte ele al. Bu bir yorum kuralıdır; her somut iddiayı kaynaklı bulguyla destekle."

  - id: R-004
    tur: kural
    kural: "Roket motoru ve itici yangınları sorulursa kapsam dışı olduğunu söyle [F-022]."

  - id: R-005
    tur: kural
    kural: "Her deney bulgusunda koşulları belirt: yakıt, O2 oranı, basınç, akış hızı, donanım. Koşul kaynakta yoksa 'belirtilmemiş' yaz, tahmin etme."

  - id: R-006
    tur: kural
    kural: "Kaynakta olmayan bilgiye 'veri yok' de. Sayısal değeri hafızadan verme."

  - id: R-007
    tur: kural
    kural: "Kaynaklar çelişirse ikisini de kaynak ve yılıyla göster, birini seçme."

  - id: R-008
    tur: kural
    kural: "İddiaları kaynak türüne göre ayır: PSI/yayın bulgusu, challenge metni gerçeği, hesap, yorum. Yorumu gerçek gibi sunma."
